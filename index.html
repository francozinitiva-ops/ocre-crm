/* Un paquete guarda los servicios con días relativos al viaje (día 1 = salida) y costos por persona.
   Al cargarlo en una reserva, los días se convierten en fechas reales. */
const paqCostoPP = p => sum(p.servicios||[], s=>s.costo);
const paqVendidos = p => DB.reservas.filter(r=>r.paqueteId===p.id && r.estado!=="Cancelada").length;
function nuevoPaquete(){
  ed = {id:null, _paq:true, nombre:"", destinoId:"", noches:1, moneda:"ARS", tarifaPax:"", vtoSaldoDias:30, descripcion:"", activo:"Sí", servicios:[]};
  go("paqEdit");
}
function editarPaquete(id){ ed = Object.assign(clone(byId(DB.paquetes,id)), {_paq:true}); go("paqEdit"); }
function duplicarPaquete(id){
  const p = clone(byId(DB.paquetes,id)); p.id = nuevoId("PAQ"); p.nombre += " (copia)";
  p.servicios.forEach(s=>s.id = uid()); DB.paquetes.push(p); save(); render(); toast("Paquete duplicado.");
}
function nuevoServPaq(tipo){
  const s = {id:uid(), tipo, proveedorId:"", operadorId:"", costo:"", pagoDias:"", notas:"", dia:1};
  if(tipo==="alojamiento") Object.assign(s, {noches:n0(ed.noches)||1, hab:{tipo:"Doble", camas:"Matrimonial", regimen:"Desayuno"}});
  if(tipo==="aereo") Object.assign(s, {aerolinea:"", ruta:"", diaIda:1, diaVuelta:(n0(ed.noches)||0)+1, equipaje:"Carry-on"});
  if(tipo==="traslado") Object.assign(s, {tramo:"", modalidad:"Privado"});
  if(tipo==="excursion") Object.assign(s, {nombre:"", modalidad:"Regular"});
  if(tipo==="asistencia") Object.assign(s, {plan:""});
  if(tipo==="paquete"||tipo==="otro") Object.assign(s, {descripcion:"", incluye:""});
  ed.servicios.push(s); render();
}
function svcPaq(s, i){

    case "aereo": campos = `<div class="grid g4"><div class="span2">${inp(p+"aerolinea", s.aerolinea, "Aerolínea")}</div><div class="span2">${inp(p+"ruta", s.ruta, "Ruta")}</div>
        ${dia("diaIda","Ida: día")}${dia("diaVuelta","Vuelta: día")}${sel(p+"equipaje", s.equipaje, "Equipaje", EQUIPAJE)}</div>`; break;
    case "traslado": campos = `<div class="grid g4"><div class="span2">${inp(p+"tramo", s.tramo, "Tramo", "text", 'placeholder="San Juan – Barreal"')}</div>
        ${dia("dia","Día")}${sel(p+"modalidad", s.modalidad, "Modalidad", ["Privado","Regular / compartido"])}
        <div class="span2">${provSelect(p+"proveedorId", s.proveedorId, "Transporte", "Transportista")}</div></div>`; break;
    case "excursion": campos = `<div class="grid g4"><div class="span2">${inp(p+"nombre", s.nombre, "Excursión")}</div>

        ${inp(p+"pagoDias", s.pagoDias, "Pagar al proveedor (días antes de salir)", "number", 'min="0" placeholder="Opcional"')}
        ${inp(p+"notas", s.notas, "Notas")}

}
function resumenPaq(p){
  const c = paqCostoPP(p), v = n0(p.tarifaPax);

/* Convierte un servicio de plantilla en un servicio de reserva con fechas reales */
function svcDesdePlantilla(t, salida, noches){
  const D = n => salida ? addDays(salida, Math.max(1, n0(n)||1) - 1) : "";
  const s = {id:uid(), tipo:t.tipo, estado:"Confirmado", proveedorId:t.proveedorId||"", operadorId:t.operadorId||"", localizador:"",
    costo:t.costo, vtoPago: salida && t.pagoDias!=="" && t.pagoDias!=null ? addDays(salida, -n0(t.pagoDias)) : "", notas:t.notas||""};
  switch(t.tipo){
    case "alojamiento": { const ci = D(t.dia); Object.assign(s, {checkin:ci, checkout: ci ? addDays(ci, n0(t.noches)||1) : "", habitaciones:[Object.assign({cant:1}, t.hab)]}); break; }
    case "aereo": Object.assign(s, {aerolinea:t.aerolinea, ruta:t.ruta, ida:D(t.diaIda), vuelta:t.diaVuelta?D(t.diaVuelta):"", equipaje:t.equipaje}); break;
    case "traslado": Object.assign(s, {tramo:t.tramo, fecha:D(t.dia), modalidad:t.modalidad}); break;
    case "excursion": Object.assign(s, {nombre:t.nombre, fecha:D(t.dia), modalidad:t.modalidad}); break;
    case "asistencia": Object.assign(s, {plan:t.plan, desde:salida, hasta: salida ? addDays(salida, n0(noches)) : ""}); break;
    default: Object.assign(s, {descripcion:t.descripcion, incluye:t.incluye});
  }
  return s;
}
function aplicarPaquete(pk, salida){
  if(ed.servicios.length && ed.moneda!==pk.moneda){ toast(`La reserva está en ${ed.moneda} y el paquete en ${pk.moneda}. Usalo en una reserva en ${pk.moneda} o duplicá el paquete en ${ed.moneda}.`); render(); return false; }
  if(!ed.servicios.length) ed.moneda = pk.moneda;
  if(!ed.destinoId) ed.destinoId = pk.destinoId;
  if(!ed.titulo) ed.titulo = pk.nombre;
  if(salida){ ed.salida = salida; ed.regreso = addDays(salida, n0(pk.noches)); if(!ed.vtoSaldo && pk.vtoSaldoDias!=="") ed.vtoSaldo = addDays(salida, -n0(pk.vtoSaldoDias)); }
  if(!n0(ed.tarifaPax)) ed.tarifaPax = pk.tarifaPax;
  else if(confirm(`La reserva ya tiene una tarifa de ${money(ed.tarifaPax,ed.moneda)} por persona. ¿Le sumo la del paquete (${money(pk.tarifaPax,pk.moneda)})?\nAceptar: sumar · Cancelar: dejar la actual`)) ed.tarifaPax = n0(ed.tarifaPax) + n0(pk.tarifaPax);
  pk.servicios.forEach(t=>ed.servicios.push(svcDesdePlantilla(t, salida, pk.noches)));
  ed.paqueteId = pk.id;
  return true;
}

/* Número de WhatsApp en formato internacional (Argentina por defecto) */
function waNum(tel){
  let d = String(tel||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("54")) return d.startsWith("549") ? d : "549"+d.slice(2);
  if(d.startsWith("0")) d = d.slice(1);
  if(d.length===12) for(const a of [2,3,4]) if(d.slice(a,a+2)==="15"){ d = d.slice(0,a)+d.slice(a+2); break; }
  return d.length===10 ? "549"+d : d;
}
/* Todo lo pendiente de cobrar a clientes y de pagar a proveedores, con su fecha de vencimiento */
function avisos(){
  const L = [];
  DB.reservas.filter(r=>r.estado!=="Cancelada").forEach(r=>{
    const sal = saldo(r);
    if(sal>0.5) L.push({k:"cobro", key:"C-"+r.id, fecha:r.vtoSaldo||"", r, monto:sal,
      quien:nombreCliente(r.clienteId), que:tituloRes(r)});
    svcActivos(r).forEach(s=>{
      const d = svcC(s,r) - pagadoSvc(s);
      if(d>0.5) L.push({k:"pago", key:"P-"+s.id, fecha:s.vtoPago||"", r, s, monto:d,
        quien:(s.operadorId||s.proveedorId) ? nombreProv(s.operadorId||s.proveedorId) : "Proveedor sin asignar", que:SVC[s.tipo].t+" · "+tituloRes(r)});
    });
  });
  return L;
}
function tramo(a){
  if(!a.fecha) return "sin";
  const d = diffDays(today(), a.fecha), n = n0(DB.cfg.avisoDias)||7;
  return d<0 ? "vencido" : d===0 ? "hoy" : d<=n ? "pronto" : d<=30 ? "mes" : "despues";
}
const TRAMOS = [
  {k:"vencido", t:"Vencidos"}, {k:"hoy", t:"Vencen hoy"}, {k:"pronto", t:()=>`Próximos ${n0(DB.cfg.avisoDias)||7} días`},
  {k:"mes", t:"Dentro de los próximos 30 días"}, {k:"despues", t:"Más adelante"}, {k:"sin", t:"Sin fecha de vencimiento"}];
const urgentes = () => avisos().filter(a=>["vencido","hoy"].includes(tramo(a)));
function cuandoTxt(a){
  if(!a.fecha) return "sin fecha";
  const d = diffDays(today(), a.fecha);
  return d<0 ? `venció hace ${-d} ${d===-1?"día":"días"}` : d===0 ? "vence hoy" : d===1 ? "vence mañana" : `vence en ${d} días`;
}
function msgRecordatorio(a){
  const r = a.r, c = byId(DB.clientes, r.clienteId) || {};
  const d = a.fecha ? diffDays(today(), a.fecha) : null;
  const vto = !a.fecha ? "está pendiente" : d<0 ? `venció el ${fdate(a.fecha,1)}` : d===0 ? "vence hoy" : `vence el ${fdate(a.fecha,1)}`;
  return String(DB.cfg.msgRecordatorio||"")
    .replaceAll("{nombre}", c.nombre||nom(c)).replaceAll("{agencia}", DB.cfg.agencia)
    .replaceAll("{viaje}", tituloRes(r)).replaceAll("{reserva}", r.id)
    .replaceAll("{saldo}", money(a.monto, r.moneda)).replaceAll("{vencimiento}", vto);
}
function recordar(key){
  const a = avisos().find(x=>x.key===key); if(!a) return;
  const c = byId(DB.clientes, a.r.clienteId) || {}, n = waNum(c.telefono);
  const txt = msgRecordatorio(a);
  a.r.recordatorios = (a.r.recordatorios||[]).concat(today()); save();
  if(!n){ copiar(txt, "El cliente no tiene teléfono cargado. Te copié el mensaje."); render(); return; }
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`, "_blank", "noopener");

}
function setVto(key, v){

/* Barra de aviso arriba de cada pantalla, una vez por sesión */
let avisoCerrado = false;
function barraAvisos(){
  if(avisoCerrado || vista==="avisos") return "";
  const U = urgentes(); if(!U.length) return "";
  const v = U.filter(a=>tramo(a)==="vencido").length, h = U.length - v;
  const c = sumM(U.filter(a=>a.k==="cobro"), a=>a.r.moneda, a=>a.monto), p = sumM(U.filter(a=>a.k==="pago"), a=>a.r.moneda, a=>a.monto);
  const partes = [v?`${v} ${v===1?"vencimiento atrasado":"vencimientos atrasados"}`:"", h?`${h} ${h===1?"vence":"vencen"} hoy`:""].filter(Boolean).join(" y ");
  return `<div class="avbar"><span class="avbar-i" aria-hidden="true">!</span><div><b>${partes[0].toUpperCase()+partes.slice(1)}.</b>
    ${posM(c)?`${fmtM(c," + ")} por cobrar`:""}${posM(c)&&posM(p)?" · ":""}${posM(p)?`${fmtM(p," + ")} por pagar`:""}</div>
    <button class="btn sm" onclick="go('avisos')">Ver avisos</button><button class="x" onclick="avisoCerrado=true;render()" aria-label="Cerrar">×</button></div>`;
}
/* Exporta los vencimientos como archivo de calendario (.ics) para Google Calendar, Outlook o el celular */
function exportarICS(){
  const L = avisos().filter(a=>a.fecha && a.fecha >= addDays(today(),-1));
  if(!L.length) return toast("No hay vencimientos con fecha para exportar.");
  const icsEsc = t => String(t).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const d8 = iso => iso.replaceAll("-","");
  const now = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ev = L.map(a=>{
    const t = a.k==="cobro" ? `Cobrar saldo · ${a.quien} · ${money(a.monto,a.r.moneda)}` : `Pagar a ${a.quien} · ${money(a.monto,a.r.moneda)}`;
    return ["BEGIN:VEVENT", `UID:${a.key}@ocre-crm`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${d8(a.fecha)}`, `DTEND;VALUE=DATE:${d8(addDays(a.fecha,1))}`,
      `SUMMARY:${icsEsc(t)}`, `DESCRIPTION:${icsEsc(`${a.r.id} · ${a.que}`)}`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(t)}`,`TRIGGER:-P${n0(DB.cfg.avisoDias)||7}D`,"END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(t)}`,"TRIGGER:PT9H","END:VALARM","END:VEVENT"].join("\r\n");
  });
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ocre//CRM//ES","CALSCALE:GREGORIAN",`X-WR-CALNAME:${icsEsc(DB.cfg.agencia+" · vencimientos")}`, ...ev, "END:VCALENDAR"].join("\r\n");
  descargar(`vencimientos_${today()}.ics`, ics, "text/calendar");
  toast(`${L.length} vencimientos exportados. Abrí el archivo para sumarlos a tu calendario.`);
}

function textoPoliticas(t){
  let n = 0, out = "", ul = false;
  const cierraUl = () => { if(ul){ out += "</ul>"; ul = false; } };
  String(t||"").split("\n").forEach(line=>{
    const l = line.trim();
    if(!l){ cierraUl(); return; }
    if(l.startsWith("## ")){ cierraUl(); out += `<h4>${++n}. ${esc(l.slice(3))}</h4>`; return; }
    if(/^[-•] /.test(l)){ if(!ul){ out += "<ul>"; ul = true; } out += `<li>${esc(l.slice(2))}</li>`; return; }
    cierraUl(); out += `<p>${esc(l)}</p>`;
  });
  cierraUl(); return out;
}
function svcContrato(s){
  const pr = s.proveedorId ? nombreProv(s.proveedorId) : "";
  const L = [];
  switch(s.tipo){
    case "alojamiento": {
      const n = s.checkin&&s.checkout ? diffDays(s.checkin,s.checkout) : 0;
      L.push(pr || "Alojamiento a confirmar");
      L.push(`${fdate(s.checkin)} al ${fdate(s.checkout)}${n?` · ${n} ${n===1?"noche":"noches"}`:""}`);
      (s.habitaciones||[]).forEach(h=>L.push(`${h.cant} habitación ${String(h.tipo).toLowerCase()}${h.camas&&h.camas!=="A confirmar"?" ("+String(h.camas).toLowerCase()+")":""} · ${String(h.regimen).toLowerCase()}`));
      break; }
    case "aereo": L.push([s.aerolinea||"Pasaje aéreo", s.ruta].filter(Boolean).join(" · ")); L.push(`Ida ${fdate(s.ida)}${s.vuelta?` · vuelta ${fdate(s.vuelta)}`:""} · equipaje: ${String(s.equipaje||"según tarifa").toLowerCase()}`); break;
    case "traslado": L.push(s.tramo||"Traslado"); L.push(`${fdate(s.fecha)} · servicio ${String(s.modalidad||"").toLowerCase()}`); break;
    case "excursion": L.push(s.nombre||"Excursión"); L.push(`${fdate(s.fecha)} · servicio ${String(s.modalidad||"").toLowerCase()}`); break;
    case "asistencia": L.push([pr||"Asistencia al viajero", s.plan].filter(Boolean).join(" · ")); L.push(`Vigencia ${fdate(s.desde)} al ${fdate(s.hasta)}`); break;
    default: L.push(s.descripcion||SVC[s.tipo].t); if(s.incluye) L.push(s.incluye);
  }
  return `<tr><td class="ct-tipo">${SVC[s.tipo].t}</td><td><b>${esc(L[0])}</b>${L.slice(1).map(x=>`<div>${esc(x)}</div>`).join("")}</td></tr>`;
}

let cliQ = "", cliLoc = "";
const buscar = (varName, valor) => `<input class="search" placeholder="Buscar…" value="${esc(valor)}" oninput="${varName}=this.value;clearTimeout(window._bq);window._bq=setTimeout(()=>{render();const s=document.querySelector('.search');s.focus();s.setSelectionRange(99,99)},250)">`;
/* ── perfil del cliente: edad, cumpleaños, métricas ── */
function edad(nac, ref){
  if(!nac) return null; const h = ref || today();
  let e = Number(h.slice(0,4)) - Number(nac.slice(0,4)); if(h.slice(5) < nac.slice(5)) e--; return e;
}
function proxCumple(nac){
  if(!nac) return null; const h = today(), y = Number(h.slice(0,4)), md = nac.slice(5);
  let f = y+"-"+md; if(f < h) f = (y+1)+"-"+md;
  return {fecha:f, dias:diffDays(h,f), cumple:edad(nac,f)};
}
/* clientes y pasajeros (que no son clientes) con cumpleaños dentro de N días */
function cumpleanieros(dias){
  const L = [], docs = new Set(), limpio = d => String(d||"").replace(/\D/g,"");
  DB.clientes.forEach(c=>{ if(c.doc) docs.add(limpio(c.doc));
    if(c.nacimiento) L.push({nombre:nom(c), nac:c.nacimiento, tel:c.telefono, clienteId:c.id}); });
  DB.reservas.filter(r=>r.estado!=="Cancelada").forEach(r=>(r.pasajeros||[]).forEach(p=>{
    const d = limpio(p.doc);
    if(!p.nac || p.clienteId || (d && docs.has(d))) return; if(d) docs.add(d);
    L.push({nombre:p.nombre, nac:p.nac, tel:"", reservaId:r.id, titular:nombreCliente(r.clienteId)});
  }));
  return L.map(x=>Object.assign(x, proxCumple(x.nac))).filter(x=>x.dias<=dias).sort((a,b)=>a.dias-b.dias);
}
let _cumples = [];
function saludar(i){
  const x = _cumples[i]; if(!x) return;
  const txt = String(DB.cfg.msgCumple||"").replaceAll("{nombre}", x.nombre.split(" ")[0]).replaceAll("{agencia}", DB.cfg.agencia);
  if(x.clienteId){ const c = byId(DB.clientes,x.clienteId); if(c){ c.ultSaludo = today(); save(); } }
  const n = waNum(x.tel);
  if(!n) return copiar(txt, x.reservaId ? `Viaja con ${x.titular}: te copié el saludo para mandárselo.` : "No tiene teléfono cargado: te copié el saludo.");
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`, "_blank", "noopener"); render();
}
function boxCumples(){
  _cumples = cumpleanieros(15);
  return `<div class="box"><h2>Cumpleaños · próximos 15 días</h2>${_cumples.length?`<div class="list">${_cumples.slice(0,8).map((x,i)=>`
    <div class="it" style="cursor:default"><span class="when" style="${x.dias===0?"color:var(--terra);font-weight:700":""}">${x.dias===0?"hoy":x.dias===1?"mañana":fdate(x.fecha)}</span>
      <div><div class="t1">${x.clienteId?`<a style="cursor:pointer;color:inherit" onclick="verCliente('${x.clienteId}')">${esc(x.nombre)}</a>`:esc(x.nombre)}</div>
        <div class="tiny">Cumple ${x.cumple}${x.reservaId?` · viajó con ${esc(x.titular)}`:""}${x.clienteId&&byId(DB.clientes,x.clienteId)?.ultSaludo===today()?" · saludado hoy":""}</div></div>
      <div class="r"><button class="btn ${x.dias===0?"":"sec"} sm" onclick="saludar(${i})">Saludar</button></div></div>`).join("")}</div>`
    :`<div class="muted small">Nadie cumple años en los próximos 15 días.${DB.clientes.some(c=>!c.nacimiento)?" Cargá la fecha de nacimiento de tus clientes para que aparezcan acá.":""}</div>`}</div>`;
}
function statsCliente(c){
  const rs = DB.reservas.filter(r=>r.clienteId===c.id && r.estado!=="Cancelada");
  const gastado = sumM(rs, monR, totalVenta);
  const h = today();
  return { rs, n:rs.length, gastado, ticket: avgM(rs, monR, totalVenta),
    ult: sortBy(rs.filter(r=>r.salida && r.salida<=h), r=>r.salida).at(-1),
    prox: sortBy(rs.filter(r=>r.salida && r.salida>h), r=>r.salida)[0],
    destinos: [...new Set(rs.map(r=>nombreDest(r.destinoId)))],
    comoPax: DB.reservas.filter(r=>r.estado!=="Cancelada" && r.clienteId!==c.id && (r.pasajeros||[]).some(p=>p.clienteId===c.id || (c.doc && p.doc===c.doc))) };
}

const TIPO_CLASS = {"Frecuente":"t-olive","Recurrente":"t-sky","Una compra":"t-gray","Sin compras":"t-ocre"};

function perfilPublico(S){
  const C = DB.clientes, n = C.length;
  if(!n) return `<div class="box empty"><b>Sin clientes todavía</b>El análisis aparece cuando cargues clientes.</div>`;

  const rango = e => (RANGOS.find(([,a,b])=>e>=a&&e<=b)||["?"])[0];
  const porRango = arr => RANGOS.map(([t])=>[t, arr.filter(e=>rango(e)===t).length]).filter(x=>x[1]);
  const paxEdades = []; const vistos = new Set();
  DB.reservas.filter(r=>r.estado!=="Cancelada").forEach(r=>(r.pasajeros||[]).forEach(p=>{ const k = p.doc||p.nombre; if(p.nac && !vistos.has(k)){ vistos.add(k); paxEdades.push(edad(p.nac, r.salida||today())); } }));
  const multi = k => { const m = {}; C.forEach(c=>(c[k]||[]).forEach(v=>m[v]=(m[v]||0)+1)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const simple = k => contar(C, c=>c[k]||"").map(([a,b])=>[a,b,pct(b)]);
  const destinos = contar(DB.reservas.filter(r=>r.estado!=="Cancelada"), r=>nombreDest(r.destinoId));
  const tamGrupo = contar(DB.reservas.filter(r=>r.estado!=="Cancelada"&&paxCount(r)), r=>{ const p = paxCount(r); return p===1?"1 pasajero":p===2?"2 pasajeros":p<=4?"3 a 4":p<=8?"5 a 8":"9 o más"; });
  const completo = k => Math.round(C.filter(c=>Array.isArray(c[k]) ? c[k].length : c[k]).length/n*100);
  const k = (v,lb) => `<div class="k"><div class="v sm">${v}</div><div class="lb">${lb}</div></div>`;
  return `<div class="box"><div class="krow">
      ${k(n,"Clientes")}

      ${k(nRes?fmtM(ticketM):"—","Ticket promedio por reserva")}
      ${k(compradores.length?fmtM(gastoCli):"—","Gasto promedio por cliente")}
      ${k(edades.length?Math.round(sum(edades,x=>x)/edades.length)+" años":"—","Edad promedio del titular")}
    </div></div>
    <div class="dgrid">
      ${boxTop("Edad de los titulares", porRango(edades), edades.length<n?`Sin fecha de nacimiento: ${n-edades.length} clientes.`:"")}
      ${boxTop("Edad de todos los pasajeros", porRango(paxEdades), "Incluye acompañantes, a la fecha de salida.")}
      ${boxTop("Con quién viajan", multi("viajaCon"))}
      ${boxTop("Tamaño de los grupos", tamGrupo, "Pasajeros por reserva.")}
      ${boxTop("Intereses", multi("intereses"))}
      ${boxTop("Perfil", simple("segmento"))}
      ${boxTop("Presupuesto habitual", simple("presupuesto"))}

      ${boxTop("Destinos que compraron", destinos)}
      <div class="box"><h2>Completitud de la base</h2><div class="hb">
        ${[["Fecha de nacimiento","nacimiento"],["Localidad","localidad"],["Intereses","intereses"],["Con quién viaja","viajaCon"],["Perfil","segmento"],["Presupuesto","presupuesto"],["Acepta novedades","aceptaNovedades"]].map(([t,f])=>{ const v = f==="aceptaNovedades" ? Math.round(C.filter(c=>c.aceptaNovedades==="Sí").length/n*100) : completo(f);
          return `<span>${t}</span><div class="tr"><i style="width:${v}%;background:${v<50?"var(--terra)":"var(--olive)"}"></i></div><span class="small">${v}%</span>`; }).join("")}

function cargarCatalogo(){
  const ex = new Set(DB.destinos.map(d=>d.nombre.toLowerCase()));
  const nuevos = CATALOGO.filter(c=>!ex.has(c[0].toLowerCase()));
  if(!nuevos.length) return toast("Ya están todos los destinos del catálogo.");
  if(!confirm(`Se agregan ${nuevos.length} destinos. Los que ya existen no se tocan. ¿Seguir?`)) return;
  nuevos.forEach(c=>DB.destinos.push({id:nuevoId("DES"), nombre:c[0], provincia:c[1], tipo:c[2], notas:c[3]}));
  save(); render(); toast(`${nuevos.length} destinos cargados.`);
}

function sumarLista(k){ const i = $("add_"+k), v = i.value.trim(); if(!v) return; if(DB.cfg[k].includes(v)) return toast("Ya está en la lista.");
  if(k==="feriados" && !/^\d{4}-\d{2}-\d{2}( |$)/.test(v)) return toast("Escribilo así: 2027-06-17 Güemes");
  DB.cfg[k].push(v); if(k==="feriados") DB.cfg[k].sort(); save(); render(); }
function quitarLista(k,i){ DB.cfg[k].splice(i,1); save(); render(); }
/* Descargas: dentro del visor de Claude se usa la capacidad "downloads"
   (pide confirmación); fuera del visor, un enlace de descarga común. */
async function descargar(nombre, data, mime){
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename:nombre, data}); toast("Archivo descargado."); }
    catch(e){
      const c = e && e.code;
      if(c==="declined") return;
      if(c==="rejected_extension"||c==="extension_not_enabled") return toast("Este tipo de archivo no se puede descargar desde el visor de Claude.");
      if(c==="rate_limited") return toast("Ya hay una descarga esperando confirmación.");
      toast("No se pudo descargar el archivo.");
    }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:mime||"application/octet-stream"}));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportar(){
  descargar(`ocre_respaldo_${today()}.json`, JSON.stringify(DB,null,1), "application/json");
}
function leerJSON(input, fn){
  const f = input.files[0]; if(!f) return; const rd = new FileReader();
  rd.onload = e => { try{ fn(JSON.parse(e.target.result)); }catch(err){ toast("El archivo no es un respaldo válido."); } input.value = ""; };
  rd.readAsText(f);
}
function importar(input){
  leerJSON(input, p=>{
    if(!p.cont || !Array.isArray(p.reservas)) return toast("Ese archivo no es un respaldo de este sistema.");
    if(!confirm("Restaurar reemplaza todos los datos del CRM (los compartidos con tu socio/a) por los del respaldo. ¿Seguir?")) return;
    merge(p); ajustarCont(); save(); render(); toast("Respaldo restaurado. Subiendo los datos…");
  });
}
function importarViejo(input){
  leerJSON(input, p=>{
    if(!p.contadores || !Array.isArray(p.clientes)) return toast("No parece un respaldo del sistema anterior.");
    const mapDes = {}; let n = {d:0,c:0,p:0};
    (p.destinos||[]).forEach(d=>{ let x = DB.destinos.find(y=>y.nombre.toLowerCase()===d.nombre.toLowerCase());
      if(!x){ x = {id:nuevoId("DES"), nombre:d.nombre, provincia:d.provincia||"", tipo:d.tipo||"emisivo", notas:d.notas||""}; DB.destinos.push(x); n.d++; }
      mapDes[d.id] = x.id; });
    (p.clientes||[]).forEach(c=>{ if(DB.clientes.some(y=>nom(y).toLowerCase()===c.nombre.toLowerCase())) return;
      DB.clientes.push({id:nuevoId("CLI"), nombre:c.nombre, apellido:"", doc:c.doc||"", nacimiento:"", telefono:c.telefono||"", email:c.email||"", localidad:"", domicilio:"", canal:"", referidoPor:"", cuit:"", notas:[c.origen?"Origen: "+c.origen:"", c.notas||""].filter(Boolean).join("\n"), alta:today()}); n.c++; });
    const tipoMap = {"Alojamiento":"Alojamiento","Traslado":"Transporte","Aéreo":"Aerolínea","Excursión":"Excursiones","Gastronomía":"Gastronomía","Mayorista":"Operador / Mayorista","Operador local":"Operador / Mayorista"};
    (p.proveedores||[]).forEach(v=>{ if(DB.proveedores.some(y=>y.nombre.toLowerCase()===v.nombre.toLowerCase())) return;
      DB.proveedores.push({id:nuevoId("PRV"), nombre:v.nombre, tipo:tipoMap[v.categoria]||"Otro", contacto:v.contacto||"", telefono:v.telefono||"", email:v.email||"", web:"", cuit:v.cuit||"",
        tarifa:"Neta", comision:"", moneda:v.moneda||"ARS", destinos:(v.destinos||[]).map(id=>mapDes[id]).filter(Boolean), vtoHabilitacion:"", vtoPoliza:"", vtoRTO:"", condiciones:"", notas:v.notas||""}); n.p++; });
    let ne = 0;
    (p.egresos||[]).forEach(e=>{ if(DB.egresos.some(y=>y.fecha===e.fecha && y.descripcion===e.descripcion && n0(y.monto)===n0(e.monto))) return;
      if(e.categoria && !DB.cfg.catEgresos.includes(e.categoria)) DB.cfg.catEgresos.push(e.categoria);
      DB.egresos.push({id:nuevoId("EGR"), fecha:e.fecha||today(), categoria:e.categoria||"Varios", descripcion:e.descripcion||"", tipoGasto:e.fijo?"Fijo":"Variable",
        monto:n0(e.monto), moneda:"ARS", medio:e.medio||"", comprobante:e.comprobante||"", notas:""}); ne++; });
    save(); render(); toast(`Importados: ${n.c} clientes, ${n.p} proveedores, ${n.d} destinos, ${ne} egresos.`);
  });
}

/* ═════════════ EGRESOS ═════════════ */
let egrMes = mesDe(today()), egrCat = "";
const mesAnterior = ym => { const d = new Date(ym+"-15T12:00:00"); d.setMonth(d.getMonth()-1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
VIEWS.egresos = function(){
  const delMes = DB.egresos.filter(e=>!egrMes || mesDe(e.fecha)===egrMes);
  const L = sortBy(delMes.filter(e=>!egrCat || e.categoria===egrCat), e=>e.fecha+e.id).reverse();
  const eM = arr => sumM(arr, e=>e.moneda, e=>e.monto);
  const tot = eM(delMes), fijos = eM(delMes.filter(e=>e.tipoGasto==="Fijo"));
  /* variación: solo en pesos (los egresos en otra moneda no se comparan) */
  const totP = n0(tot.ARS), prev = egrMes ? n0(eM(DB.egresos.filter(e=>mesDe(e.fecha)===mesAnterior(egrMes))).ARS) : 0;
  const var_ = prev ? Math.round((totP-prev)/prev*100) : null;
  const cats = contar(delMes, e=>e.categoria).map(([c])=>{ const xs = delMes.filter(e=>e.categoria===c); return [c, sum(xs, e=>toARS(e.monto,e.moneda)), eM(xs)]; }).sort((a,b)=>b[1]-a[1]);
  const hayFijosPrev = egrMes && DB.egresos.some(f=>f.tipoGasto==="Fijo" && mesDe(f.fecha)===mesAnterior(egrMes) &&
    !DB.egresos.some(e=>mesDe(e.fecha)===egrMes && e.descripcion===f.descripcion && e.categoria===f.categoria));
  return head("Egresos", "Gastos de funcionamiento de la agencia. Lo que pagás a proveedores por cada viaje se registra dentro de la reserva, no acá.",
      `${hayFijosPrev?`<button class="btn sec" onclick="repetirFijos()">Repetir fijos de ${fmes(mesAnterior(egrMes))}</button>`:""}<button class="btn" onclick="editar('egresos')">Nuevo egreso</button>`) +
    `<div class="row" style="margin-bottom:14px"><span class="small muted">Mes</span>
      <input type="month" value="${egrMes}" style="width:auto" onchange="if(this.value&&this.value.slice(0,4)>='2000'){egrMes=this.value;render()}">
      <button class="btn ghost sm" onclick="egrMes='';render()">Ver todos</button>
      <select style="width:auto" onchange="egrCat=this.value;render()">${opts(DB.cfg.catEgresos, egrCat, "Todas las categorías")}</select></div>
    ${delMes.length?`<div class="dgrid" style="margin:0 0 16px">
      <div class="box"><div class="grid g2 egk">
        <div class="k"><div class="v sm">${fmtM(tot)}</div><div class="lb">Total ${egrMes?fmes(egrMes):"histórico"}</div></div>
        <div class="k"><div class="v sm">${fmtM(fijos)}</div><div class="lb">Fijos</div></div>
        <div class="k"><div class="v sm">${fmtM(subM(tot,fijos))}</div><div class="lb">Variables</div></div>
        ${var_!==null?`<div class="k ${var_>0?"alert":""}"><div class="v sm">${var_>0?"+":""}${var_}%</div><div class="lb">contra ${fmes(mesAnterior(egrMes))}${monsM(tot).length>1?" (en pesos)":""}</div></div>`:""}
      </div></div>
      <div class="box"><div class="hb">${cats.slice(0,6).map(([n,v,m])=>`<span>${esc(n)}</span><div class="tr"><i style="width:${v/(cats[0][1]||1)*100}%;background:var(--ocre)"></i></div><span class="small">${fmtM(m," + ")}</span>`).join("")}</div></div>
    </div>`:""}
    ${L.length?`<div class="box flat"><div class="tw"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Tipo</th><th>Medio</th><th>Comprobante</th><th class="num">Monto</th></tr></thead><tbody>
      ${L.map(e=>`<tr class="click" onclick="editar('egresos','${e.id}')"><td>${fdate(e.fecha)}</td><td>${esc(e.categoria)}</td><td>${esc(e.descripcion)}</td>
        <td><span class="tag ${e.tipoGasto==="Fijo"?"t-ocre":"t-gray"}">${esc(e.tipoGasto)}</span></td><td>${esc(e.medio)}</td><td class="small">${esc(e.comprobante)}</td>
        <td class="num">${money(e.monto,e.moneda)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="6">Total</td><td class="num">${fmtM(sumM(L,e=>e.moneda,e=>e.monto))}</td></tr></tfoot></table></div></div>`
    :`<div class="box empty"><b>Sin egresos${egrMes?" en "+fmes(egrMes):""}</b>Cargá alquiler, servicios, publicidad, contador… Marcá como fijos los que se repiten y el mes siguiente los copiás con un botón.</div>`}`;
};
function repetirFijos(){
  const ant = mesAnterior(egrMes);
  const fijos = DB.egresos.filter(e=>e.tipoGasto==="Fijo" && mesDe(e.fecha)===ant);
  const ya = fijos.filter(f=>DB.egresos.some(e=>mesDe(e.fecha)===egrMes && e.descripcion===f.descripcion && e.categoria===f.categoria));
  const nuevos = fijos.filter(f=>!ya.includes(f));
  if(!nuevos.length) return toast(`Los fijos de ${fmes(ant)} ya están cargados en ${fmes(egrMes)}.`);

  nuevos.forEach(f=>{

/* ═════════════ SUPABASE ═════════════
   Cada colección del CRM es una tabla crm_* con (id, data jsonb).
   - Al entrar se traen todas las tablas.
   - Cada save() compara contra la última versión conocida del servidor (SNAP)
     y sube solo lo que cambió: altas, cambios y bajas.
   - Los cambios del otro usuario llegan en tiempo real.
   Si falla la conexión, los cambios quedan pendientes y se reintenta. */
const SUPA_URL = "https://vkaigyonaeqqznnbzhjm.supabase.co";
const SUPA_KEY = "sb_publishable_ozuroaOeGQPYXNZhrVe1KQ_UkhvxH2I";
const TABLAS = {clientes:"crm_clientes", proveedores:"crm_proveedores", destinos:"crm_destinos", leads:"crm_leads",
  reservas:"crm_reservas", cobros:"crm_cobros", pagosProv:"crm_pagos_prov", egresos:"crm_egresos", paquetes:"crm_paquetes"};
const COLS = Object.keys(TABLAS);
const DE_TABLA = Object.fromEntries(Object.entries(TABLAS).map(([k,t])=>[t,k]));
let SB = null, YO = null, SNAP = null, syncT = null, reintentoT = null;
let sincronizando = false, otraVez = false, estadoSync = "ok", errorSync = "", renderPendiente = false;

/* JSON con claves ordenadas: así lo local y lo que devuelve la base se comparan igual */
const canon = v => JSON.stringify(v, (k,x) => x && typeof x==="object" && !Array.isArray(x)
  ? Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}) : x);
const metaDe = () => { const m = {}; Object.keys(DB).forEach(k=>{ if(!COLS.includes(k)) m[k] = DB[k]; }); return m; };

function pillSync(){
  if(!SNAP) return `<span class="sync pend"><i></i>Conectando…</span>`;
  if(estadoSync==="error") return `<span class="sync error" title="${esc(errorSync)}"><i></i>Sin conexión · reintentando</span>`;
  if(estadoSync==="pend") return `<span class="sync pend"><i></i>Guardando…</span>`;
  return `<span class="sync"><i></i>Guardado en la nube</span>`;
}
function setSync(e, err){ estadoSync = e; errorSync = err ? (err.message||String(err)) : ""; const el = $("syncPill"); if(el) el.innerHTML = pillSync(); }

/* números correlativos: nunca por debajo del ID más alto que exista */
function ajustarCont(){
  COLS.forEach(k=>DB[k].forEach(x=>{ const m = /^([A-Z]+)-(\d+)$/.exec(x && x.id || ""); if(m) DB.cont[m[1]] = Math.max(DB.cont[m[1]]||0, Number(m[2])); }));
}
/* cambia un ID por otro en todo el CRM (referencias incluidas) */
function renombrarId(viejo, nuevo){
  const andar = o => { if(Array.isArray(o)) o.forEach((v,i)=>{ if(v===viejo) o[i]=nuevo; else if(v&&typeof v==="object") andar(v); });
    else if(o&&typeof o==="object") Object.keys(o).forEach(k=>{ if(o[k]===viejo) o[k]=nuevo; else if(o[k]&&typeof o[k]==="object") andar(o[k]); }); };
  COLS.forEach(k=>andar(DB[k])); andar(DB.cfg);
}

async function traerTodo(tabla, cols){
  const out = []; const N = 1000;
  for(let desde = 0; ; desde += N){
    const {data, error} = await SB.from(tabla).select(cols).order(cols.split(",")[0]).range(desde, desde+N-1);
    if(error) throw error;
    out.push(...data); if(data.length < N) break;
  }
  return out;
}
async function cargarRemoto(){
  const p = {}, snap = {meta:new Map()};
  await Promise.all(COLS.map(async k=>{
    const rows = await traerTodo(TABLAS[k], "id,data");
    p[k] = rows.map(r=>Object.assign(r.data||{}, {id:r.id}));
    snap[k] = new Map(p[k].map(x=>[x.id, canon(x)]));
  }));
  (await traerTodo("crm_meta", "clave,data")).forEach(m=>{ p[m.clave] = m.data; snap.meta.set(m.clave, canon(m.data)); });
  merge(p); ajustarCont(); SNAP = snap;
}

/* Choque de numeración: el otro usuario cargó un registro con el mismo ID
   casi al mismo tiempo. El nuestro pasa al siguiente número libre. */
async function resolverChoque(k, r){
  const viejo = r.id, pref = viejo.split("-")[0];
  const {data} = await SB.from(TABLAS[k]).select("id,data").eq("id", viejo).maybeSingle();
  const ids = await traerTodo(TABLAS[k], "id");
  ids.forEach(x=>{ const m = /^([A-Z]+)-(\d+)$/.exec(x.id); if(m && m[1]===pref) DB.cont[pref] = Math.max(DB.cont[pref]||0, Number(m[2])); });
  const nuevo = nuevoId(pref);
  renombrarId(viejo, nuevo);
  if(data){ const rec = Object.assign(data.data||{}, {id:data.id}); DB[k].push(rec); SNAP[k].set(rec.id, canon(rec)); }
  toast(`${viejo} ya lo había usado tu socio/a: lo tuyo quedó como ${nuevo}.`);
}

async function sincronizar(){
  if(!SNAP) return;
  if(sincronizando){ otraVez = true; return; }
  sincronizando = true; clearTimeout(reintentoT);
  try{
    for(const k of COLS){
      const t = TABLAS[k], snap = SNAP[k], vivos = new Set(), nuevos = [], cambios = [];
      for(const r of DB[k]){
        if(!r || !r.id) continue; vivos.add(r.id);
        const c = canon(r);
        if(!snap.has(r.id)) nuevos.push([r,c]); else if(snap.get(r.id)!==c) cambios.push([r,c]);
      }
      const borrar = [...snap.keys()].filter(id=>!vivos.has(id));
      if(nuevos.length){
        const {error} = await SB.from(t).insert(nuevos.map(([r,c])=>({id:r.id, data:JSON.parse(c)})));
        if(!error) nuevos.forEach(([r,c])=>snap.set(r.id,c));
        else if(error.code==="23505"){   /* alguno ya existe: de a uno para encontrarlo */
          for(const [r,c] of nuevos){
            const {error:e1} = await SB.from(t).insert({id:r.id, data:JSON.parse(c)});
            if(!e1) snap.set(r.id,c);
            else if(e1.code==="23505"){ await resolverChoque(k, r); otraVez = true; }
            else throw e1;
          }
        } else throw error;
      }
      if(cambios.length){
        const {error} = await SB.from(t).upsert(cambios.map(([r,c])=>({id:r.id, data:JSON.parse(c)})));
        if(error) throw error; cambios.forEach(([r,c])=>snap.set(r.id,c));
      }
      for(let i = 0; i < borrar.length; i += 150){   /* de a tandas: la lista va en la URL */
        const parte = borrar.slice(i, i+150);
        const {error} = await SB.from(t).delete().in("id", parte);
        if(error) throw error; parte.forEach(id=>snap.delete(id));
      }
    }
    const meta = Object.entries(metaDe()).map(([clave,v])=>[clave, canon(v)]).filter(([clave,c])=>SNAP.meta.get(clave)!==c);
    if(meta.length){
      const {error} = await SB.from("crm_meta").upsert(meta.map(([clave,c])=>({clave, data:JSON.parse(c)})));
      if(error) throw error; meta.forEach(([clave,c])=>SNAP.meta.set(clave,c));
    }
    setSync(otraVez ? "pend" : "ok");
    if(otraVez) refrescar();
  }catch(e){
    console.error("Sincronización:", e);
    setSync("error", e);
    if(/JWT|token|401/i.test((e.message||"")+(e.code||""))){ await SB.auth.refreshSession().catch(()=>{}); }
    reintentoT = setTimeout(sincronizar, 8000);
  }finally{
    sincronizando = false;
    if(otraVez){ otraVez = false; sincronizar(); }
  }
}

/* Cambios que llegan del otro usuario */
function aplicarRemoto(tabla, ev, nuevo, viejo){
  if(!SNAP) return;
  if(tabla==="crm_meta"){
    if(!nuevo || !nuevo.clave) return;
    const c = canon(nuevo.data); if(SNAP.meta.get(nuevo.clave)===c) return;
    SNAP.meta.set(nuevo.clave, c);
    if(nuevo.clave==="cont") Object.entries(nuevo.data||{}).forEach(([k,v])=>DB.cont[k] = Math.max(DB.cont[k]||0, Number(v)||0));
    else if(nuevo.clave==="cfg"){ DB.cfg = Object.assign(clone(CFG_DEF), nuevo.data); DB.cfg.tc = Object.assign(clone(CFG_DEF.tc), (nuevo.data||{}).tc||{}); }
    else DB[nuevo.clave] = nuevo.data;
    return refrescar();
  }
  const k = DE_TABLA[tabla]; if(!k) return;
  if(ev==="DELETE"){
    const id = viejo && viejo.id; if(!id || !SNAP[k].has(id)) return;
    SNAP[k].delete(id); DB[k] = DB[k].filter(x=>x.id!==id);
    return refrescar();
  }
  if(!nuevo || !nuevo.id) return;
  const rec = Object.assign(nuevo.data||{}, {id:nuevo.id}), c = canon(rec);
  if(SNAP[k].get(rec.id)===c) return;               /* es el eco de un cambio propio */
  SNAP[k].set(rec.id, c);
  if(k==="reservas") migrarReserva(rec);
  const i = DB[k].findIndex(x=>x.id===rec.id);
  if(i>=0) DB[k][i] = rec; else DB[k].push(rec);
  ajustarCont(); refrescar();
}
const seguroRenderizar = () => !$("modalRoot").innerHTML && !["resEdit","paqEdit"].includes(vista)
  && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
function refrescar(){ if(seguroRenderizar()) render(); else renderPendiente = true; }
setInterval(()=>{ if(renderPendiente && seguroRenderizar()){ renderPendiente = false; render(); } }, 1500);

function suscribir(){
  const canal = SB.channel("crm-cambios");
  [...Object.values(TABLAS), "crm_meta"].forEach(t=>
    canal.on("postgres_changes", {event:"*", schema:"public", table:t}, p=>aplicarRemoto(t, p.eventType, p.new, p.old)));
  canal.subscribe();
}
/* Al volver a la pestaña después de un rato, se recarga todo por si se perdió algún aviso */
let ocultoDesde = 0;
document.addEventListener("visibilitychange", async ()=>{
  if(document.hidden){ ocultoDesde = Date.now(); return; }
  if(SNAP && ocultoDesde && Date.now()-ocultoDesde > 5*60e3 && estadoSync==="ok" && seguroRenderizar()){
    try{ await cargarRemoto(); render(); }catch(e){}
  }
});
window.addEventListener("beforeunload", e=>{ if(SNAP && estadoSync!=="ok"){ e.preventDefault(); e.returnValue = ""; } });

/* ── pantalla de acceso ── */
function gate(html){ const g = $("gate"); g.hidden = false; g.innerHTML = `<div class="gate-card">${isoV(64)}${html}</div>`; }
function mostrarLogin(err){
  gate(`<form onsubmit="event.preventDefault();ingresar(this)">
    <label class="f"><span>Email</span><input name="email" type="email" autocomplete="username" required autofocus></label>
    <label class="f"><span>Contraseña</span><input name="pass" type="password" autocomplete="current-password" required></label>
    ${err?`<div class="err">${esc(err)}</div>`:""}
    <button class="btn" type="submit" style="margin-top:4px">Ingresar</button></form>`);
  setTimeout(()=>{ const i = $("gate").querySelector("input"); i && i.focus(); }, 30);
}
function mostrarCargando(txt){ gate(`<div class="gate-spin"></div><div class="msg">${esc(txt||"Cargando datos…")}</div>`); }
function mostrarAviso(txt, conSalir){ gate(`<div class="msg">${txt}</div>${conSalir?`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn sec" onclick="salir()">Cerrar sesión</button></div>`:""}`); }
async function ingresar(f){
  const email = f.email.value.trim(), password = f.pass.value;
  const b = f.querySelector("button"); b.disabled = true; b.textContent = "Ingresando…";
  const {data, error} = await SB.auth.signInWithPassword({email, password});
  if(error) return mostrarLogin(/invalid/i.test(error.message) ? "Email o contraseña incorrectos." : "No se pudo ingresar: "+error.message);
  entrar(data.user);
}
async function entrar(user){
  mostrarCargando("Verificando acceso…");
  const {data, error} = await SB.from("crm_usuarios").select("nombre,email").eq("user_id", user.id).maybeSingle();
  if(error) return mostrarAviso("No se pudo verificar el acceso.<br><span class='small'>"+esc(error.message)+"</span>", true);
  if(!data) return mostrarAviso("Tu usuario existe pero todavía no tiene acceso al CRM.<br>Pedile a Franco que te habilite.", true);
  YO = {email:user.email, nombre:data.nombre||data.email};
  mostrarCargando("Cargando datos…");
  try{ await cargarRemoto(); }
  catch(e){ return mostrarAviso("No se pudieron cargar los datos.<br><span class='small'>"+esc(e.message||String(e))+"</span><br><br><button class='btn' onclick='location.reload()'>Reintentar</button>", true); }
  suscribir();
  $("gate").hidden = true; $("gate").innerHTML = "";
  render(); save();   /* sube ajustes automáticos (configuración por defecto, migraciones) si los hubo */
}
async function salir(){
  if(SNAP && estadoSync!=="ok" && !confirm("Hay cambios que todavía no se guardaron en la nube. ¿Salir igual?")) return;
  await SB.auth.signOut().catch(()=>{}); location.reload();
}
async function arrancar(){
  if(SUPA_URL.startsWith("__")) return mostrarAviso("Falta configurar la conexión con Supabase (URL y clave pública).");
  if(!window.supabase || !window.supabase.createClient) return mostrarAviso("No se pudo cargar la librería de Supabase. Revisá la conexión a internet y recargá.");
  SB = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  mostrarCargando("Conectando…");
  const {data:{session}} = await SB.auth.getSession();
  if(session) entrar(session.user); else mostrarLogin();
}
arrancar();
</script>
